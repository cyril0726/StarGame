<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Drapeaux - StarLab</title>

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

		<link rel="stylesheet" href="../css/style.css">
		<link rel="stylesheet" href="../css/drapeaux.css">
	</head>
	
	<body>
		<header class="nav nav--game">
			<a class="nav-brand" href="../index.html"><span class="brand-icon">🪐</span><span class="brand-text">StarLab</span>	</a>
			<h1 class="nav-title">Drapeaux</h1>
			<a class="back-btn" href="../index.html">← Retour</a>
		</header>
		
		<main class="page game-page">
			<section class="game-shell">
			
<div id="map-container">
    <div class="map-header">
        <h2>Explore le monde</h2>
        <p class="map-subtitle">
            Choisis un continent et teste tes connaissances
            sur les drapeaux du monde.
        </p>
    </div>

    <div class="world-map">
        <button class="continent europe" onclick="toggleContinent('Europe', this)">
            <span>Europe</span>
        </button>
        <button class="continent afrique" onclick="toggleContinent('Afrique', this)">
            <span>Afrique</span>
        </button>
        <button class="continent asie" onclick="toggleContinent('Asie', this)">
            <span>Asie</span>
        </button>
        <button class="continent amerique" onclick="toggleContinent('Amérique', this)">
            <span>Amérique</span>
        </button>
        <button class="continent oceanie" onclick="toggleContinent('Océanie', this)">
            <span>Océanie</span>
        </button>
    </div>

    <div class="start-btn-wrapper">
        <button id="start-quiz-btn" disabled onclick="startQuizFromSelection()">
            Lancer le quiz
        </button>
    </div>
</div>

				<div id="quiz-container">
					<div id="flag-container">
						<img id="flag" src="" alt="Drapeau" loading="lazy">
					</div>
					<div id="question-container"></div>
					<div id="options-container"></div>
					<div id="feedback"></div>
				</div>
			</section>
		</main>
	
		<footer class="footer">© 2026 StarLab</footer>
		<div id="toast"></div>
		<script src="../js/drapeaux.js"></script>
	</body>
</html>
