<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Tables - StarLab</title>

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

		<link rel="stylesheet" href="../css/common.css">
		<link rel="stylesheet" href="../css/tables.css">
	</head>

	<body>
		<header class="nav nav--game">
			<a class="nav-brand" href="../index.html"><span class="brand-icon">🪐</span><span class="brand-text">StarLab</span>	</a>
			<h1 class="nav-title">Tables</h1>
			<a class="back-btn" href="../index.html">← Retour</a>
		</header>

		<main class="layout">
			<div class="content">
				<div class="game-panel">
					<section class="game-shell">
						<!-- MENU -->
						<section id="menu-screen" class="screen active">
							<h2>Quelles tables veux-tu tester ?</h2>
							<div class="tables-buttons">
								<button class="table-button" data-table="1">1</button>
								<button class="table-button" data-table="2">2</button>
								<button class="table-button" data-table="3">3</button>
								<button class="table-button" data-table="4">4</button>
								<button class="table-button" data-table="5">5</button>
								<button class="table-button" data-table="6">6</button>
								<button class="table-button" data-table="7">7</button>
								<button class="table-button" data-table="8">8</button>
								<button class="table-button" data-table="9">9</button>
							</div>
							<div class="mode-buttons">
								<button id="mode-chrono" class="btn primary">Challenge ⏱️</button>
								<button id="mode-zen" class="btn primary">Entraînement 🧘</button>
							</div>
						</section>
						<!-- GAME -->
						<section id="game-screen" class="screen">
							<div id="hud">
								<div id="score">Score : 0</div>
								<div id="errors">Erreurs : 0</div>
								<div id="progress">0/20</div>
								<div id="timer">⏱ 60</div>
							</div>
							<div id="tables-chosen">Tables sélectionnées : </div>
							<div id="question">?</div>
							<div class="answer-box">
								<input type="text" inputmode="numeric" id="answer" placeholder="Réponse">
								<button id="validate">Valider</button>
							</div>
						</section>
						<!-- END -->
						<section id="end-screen" class="screen">
							<h2>Partie terminée</h2>
							<div id="final-score"></div>
							<div id="progress-bar">
								<div id="progress-fill"></div>
							</div>
							<button id="restart" class="btn primary">Rejouer</button>
						</section>
					</section>
				</div>
			</div>
		</main>
		<footer class="footer">© 2026 StarLab</footer>
		<div id="toast"></div>
		<script src="../js/tables.js"></script>
	</body>
</html>
