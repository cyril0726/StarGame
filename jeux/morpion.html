<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Morpion - StarGame</title>
		<link rel="stylesheet" href="../css/common.css">
		<link rel="stylesheet" href="../css/morpion.css">
		<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght=300;400;600&display=swap" rel="stylesheet">
	</head>
	<body>
		<header class="nav">...</header>

		<main class="layout">
			<div class="content">
				<div class="game-panel">
					<h1>Morpion</h1>
					<div class="game-info">Joueur actuel : <span id="current-player">X</span></div>
					<div class="board" id="board">
						<div class="cell" data-index="0"></div>
						<div class="cell" data-index="1"></div>
						<div class="cell" data-index="2"></div>
						<div class="cell" data-index="3"></div>
						<div class="cell" data-index="4"></div>
						<div class="cell" data-index="5"></div>
						<div class="cell" data-index="6"></div>
						<div class="cell" data-index="7"></div>
						<div class="cell" data-index="8"></div>
					</div>
					<div class="status" id="status">À toi de jouer !</div>
				</div>
			</div>
		</main>

		<script src="../js/morpion.js"></script>
	</body>
	</html>
