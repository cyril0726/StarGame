<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarGame - Pendu</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pendu.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght=300;400;600&display=swap" rel="stylesheet">
</head>
<body class="game-page">
	<!-- BACKGROUND -->
	<div class="bg-glow"></div>
	
  <!-- NAVBAR -->
<!-- NAVBAR GAME -->
<header class="game-nav">
  
	<a href="../index.html" class="game-logo">
		🪐 <span>StarLab</span>
	</a>
  
	<h1 class="game-title">Le Pendu</h1>

	<a href="../index.html" class="back-btn">
	  <span class="arrow">←</span>
	  <span class="back-text">Retour</span>
	</a>

</header>

  <!-- MOBILE NAV -->
  <nav class="mobile-nav">
    <div class="logo" data-section="home">
      🏠
    </div>
    <div class="logo" data-section="about">
      👨‍🚀
    </div>
  </nav>

    <div class="container">
        <main class="game-container">
            <div class="game-info">
                <div id="mot"></div>
                <div id="erreurs">Erreurs : 0/6</div>
				<div id="lettres-utilisees"></div>
            </div>

            <div class="hangman-container">
    <div class="hangman">
  <svg viewBox="0 0 200 200">
    <line x1="20" y1="180" x2="180" y2="180"/>
    <line x1="60" y1="180" x2="60" y2="20"/>
    <line x1="60" y1="20" x2="140" y2="20"/>
    <line x1="140" y1="20" x2="140" y2="40"/>
    
    <circle id="head" cx="140" cy="60" r="20"/>
    <line id="body" x1="140" y1="80" x2="140" y2="130"/>
    <line id="arm1" x1="140" y1="95" x2="120" y2="110"/>
    <line id="arm2" x1="140" y1="95" x2="160" y2="110"/>
    <line id="leg1" x1="140" y1="130" x2="120" y2="160"/>
    <line id="leg2" x1="140" y1="130" x2="160" y2="160"/>
  </svg>
</div>
            </div>

            <div class="input-section">
                <input type="text" id="lettre" maxlength="1" placeholder="Devine une lettre">
                <button class="primary" id="valider-btn">
				  Valider
				</button>
            </div>
        </main>
    </div>

  <!-- FOOTER -->
  <footer class="footer">
    © 2026 StarLab
  </footer>

    <script src="../js/pendu.js"></script>
	
	<div id="toast"></div>
</body>
</html>
