<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Pendu - StarLab</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="../css/style.css">
		<link rel="stylesheet" href="../css/pendu.css">
	</head>

	<body>
		<div class="bg-glow"></div>
		<header class="nav nav--game">
			<a class="nav-brand" href="../index.html"><span class="brand-icon">🪐</span><span class="brand-text">StarLab</span>	</a>
			<h1 class="nav-title">Le Pendu</h1>
			<a class="back-btn" href="../index.html">← Retour</a>
		</header>
		<main class="layout">
			<div class="content">
				<div class="game-panel">
					<section class="game-shell">
						<div class="game-info">
							<div id="mot"></div>
							<div id="erreurs">Erreurs : 0/6</div>
							<div id="lettres-utilisees"></div>
						</div>
						<div class="hangman">
							<svg viewBox="0 0 200 200">
								<line x1="20" y1="180" x2="180" y2="180"/>
								<line x1="60" y1="180" x2="60" y2="20"/>
								<line x1="60" y1="20" x2="140" y2="20"/>
								<line x1="140" y1="20" x2="140" y2="40"/>
								<circle id="head" cx="140" cy="60" r="20"/>
								<line id="body" x1="140" y1="80" x2="140" y2="130"/>
								<line id="arm1" x1="140" y1="95" x2="120" y2="110"/>
								<line id="arm2" x1="140" y1="95" x2="160" y2="110"/>
								<line id="leg1" x1="140" y1="130" x2="120" y2="160"/>
								<line id="leg2" x1="140" y1="130" x2="160" y2="160"/>
							</svg>
						</div>
						<div class="input-section">
							<input id="lettre" maxlength="1" placeholder="Lettre">
							<button class="primary" id="valider-btn">Valider</button>
						</div>
					</section>
				</div>
			</div>
		</main>
		<footer class="footer">© 2026 StarLab</footer>
		<div id="toast"></div>
		<script src="../js/pendu.js"></script>
	</body>
</html>
